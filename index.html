<script>
/*
 * ==========================
 * PRODUKTE EINSTELLEN
 * ==========================
 *
 * price         = Preis des Produkts
 * count         = aktueller Zähler
 * allowNegative = Darf der Zähler unter 0 gehen?
 *
 * Beispiele:
 * Weizen = 5,80 € → keine negativen Werte
 * Limo   = 4,00 € → keine negativen Werte
 * Cola   = 4,00 € → keine negativen Werte
 * Pfand  = 2,00 € → negative Werte erlaubt
 */

const products = [
    { name: "Weizen", price: 5.80, count: 0, allowNegative: false },
    { name: "Limo",   price: 4.00, count: 0, allowNegative: false },
    { name: "Cola",   price: 4.00, count: 0, allowNegative: false },
    { name: "Pfand",  price: 2.00, count: 0, allowNegative: true }
];

const itemsContainer = document.getElementById("items");
const totalElement = document.getElementById("total");
const resetButton = document.getElementById("reset");

function formatEuro(value) {
    return value.toLocaleString("de-DE", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
    }) + " €";
}

function calculateTotal() {
    return products.reduce((sum, product) => {
        return sum + product.price * product.count;
    }, 0);
}

function render() {
    itemsContainer.innerHTML = "";

    products.forEach((product, index) => {
        const row = document.createElement("div");
        row.className = "item";

        row.innerHTML = `
            <button 
                class="item-button plus" 
                aria-label="${product.name} hinzufügen">
                +
            </button>

            <div class="item-center">
                <div class="item-name">${product.name}</div>
                <div class="item-count">
                    ${product.count} × ${formatEuro(product.price)}
                </div>
            </div>

            <button 
                class="item-button minus" 
                aria-label="${product.name} abziehen">
                −
            </button>
        `;

        // Produkt hinzufügen
        row.querySelector(".plus").addEventListener("click", () => {
            product.count++;
            render();
        });

        // Produkt abziehen
        row.querySelector(".minus").addEventListener("click", () => {

            // Negative Werte sind nur erlaubt,
            // wenn allowNegative auf true gesetzt ist.
            if (product.allowNegative || product.count > 0) {
                product.count--;
                render();
            }
        });

        itemsContainer.appendChild(row);
    });

    totalElement.textContent = formatEuro(calculateTotal());
}

resetButton.addEventListener("click", () => {
    products.forEach(product => product.count = 0);
    render();
});

render();
</script>
